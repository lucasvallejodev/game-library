packages:
  - 'apps/*'
  - 'packages/*'

# Install behaviour. pnpm 11 reads these here, NOT from .npmrc — the npm-style
# keys are silently ignored, so anything set there is dead config.
# pnpm's default isolated linker already prevents phantom dependencies at the
# package level, so it is left alone — forcing hoistPattern: [] only tightens
# the virtual store and can break packages that rely on undeclared deps.
#
# Workspace packages always resolve to local source, never the registry.
linkWorkspacePackages: true
preferWorkspacePackages: true
# Exact versions on install; the catalog below is the single place versions
# are chosen.
saveExact: true

# Dependency install scripts are blocked by default; each decision is recorded
# here. Managed by `pnpm approve-builds` — pnpm rewrites this block, so keep
# rationale in this comment rather than inline.
#
#   esbuild      ALLOWED  — postinstall resolves the platform binary that Vite
#                           (and therefore Vitest) needs to run at all.
#   cpu-features DENIED   — optional native perf addon for ssh2; ssh2 works
#                           without it.
#   ssh2         DENIED   — its script only builds the cpu-features binding.
#   protobufjs   DENIED   — script is not needed for library use.
#
# The last three arrive via testcontainers → dockerode. Verified: the
# integration suite starts and migrates a real Postgres with all three unbuilt.
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

# Single source of truth for dependency versions across every workspace package.
# Packages reference these with "catalog:" instead of repeating a range.
# See docs/adr.md ADR-002 (monorepo) and the TypeScript note below.
catalog:
  # --- Language & runtime -------------------------------------------------
  # Pinned to the 5.x line deliberately: typescript-eslint declares
  # `typescript: >=4.8.4 <6.1.0`, so TypeScript 7 (the native Go compiler)
  # would cost us all type-aware lint rules. Revisit when typescript-eslint
  # ships TS 7 support.
  typescript: 5.9.3
  '@types/node': 26.4.0
  tsx: 4.23.13

  # --- Lint & format ------------------------------------------------------
  eslint: 10.9.1
  '@eslint/js': 10.0.1
  typescript-eslint: 8.68.0
  eslint-config-prettier: 10.1.8
  globals: 17.11.0
  prettier: 3.9.6

  # --- Database -----------------------------------------------------------
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9
  uuid: 14.0.2
  dotenv: 17.4.2

  # --- API ----------------------------------------------------------------
  fastify: 5.12.1
  '@fastify/helmet': 13.1.1
  '@fastify/cors': 11.3.0
  '@fastify/rate-limit': 11.2.0
  '@fastify/swagger': 9.8.1
  '@fastify/swagger-ui': 6.1.1
  fastify-plugin: 6.0.0
  fastify-type-provider-zod: 7.0.0
  zod: 4.5.4
  ioredis: 6.0.0
  close-with-grace: 2.5.0
  pino: 10.3.1
  pino-pretty: 13.1.3

  # --- Test ---------------------------------------------------------------
  vitest: 4.1.11
  '@testcontainers/postgresql': 12.1.0
  '@testcontainers/redis': 12.1.0
