# Development infrastructure for Game Library.
#
#   docker compose up -d          start Postgres, Redis, MinIO
#   docker compose ps             check health
#   docker compose down           stop (volumes survive)
#   docker compose down -v        stop and DESTROY all data
#
# The api and web services are not here yet — they run on the host via
# `pnpm dev` until increment 13 containerizes them. Values come from .env;
# see .env.example for the documented template.
#
# Ports are published to localhost only. docker-compose.prod.yml removes the
# Postgres and Redis port mappings entirely — see docs/security.md §8.

name: game-library

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: gamelib-redis
    restart: unless-stopped
    # appendonly keeps the Twitch token cache across restarts, so a compose
    # restart does not force a fresh token request. See docs/architecture.md §6.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: gamelib-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000' # S3 API
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # One-shot: creates the media bucket and makes sure it is NOT public.
  # Media is served through the API so ownership can be checked — never by
  # exposing the bucket. See docs/security.md §5.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: gamelib-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$S3_BUCKET\";
      mc anonymous set none local/\"$$S3_BUCKET\";
      echo \"bucket ready: $$S3_BUCKET (private)\";
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
